# Famili V2 Visual Asset Registry
#
# RESEARCH / GOVERNANCE — asset identity, not binary storage.
# FAMILI_V2_STORAGE_DECISION = LOCAL_REFERENCE_PLUS_REGISTRY
# (see ADR-0018). Binaries stay outside the AiFamily git worktree until
# Git LFS or an approved asset store exists. .gitattributes marks *.png as
# binary but the repo has no Git LFS policy.
#
# DO NOT delete historical V1 smoke assets in D:\Family.

schema_version: "1.0"
updated: "2026-09-03"
storage_decision: LOCAL_REFERENCE_PLUS_REGISTRY
storage_rationale: >
  AiFamily has no Git LFS. Identity/Office/Interaction masters are ~2MB PNG each.
  Committing them would bloat the canonical repo without an approved large-file
  pipeline. Hashes + local absolute/relative locator are the Gate1 contract;
  migration into git or object storage requires a later ADR.

