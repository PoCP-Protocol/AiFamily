  - capability: family_need_orchestration
    canonical_path: backend/domains/family_need
    status: MIGRATED_TESTED
    disposition: REIMPLEMENT
    source_reference: "docs/00_system/FAMILY_NEEDS_PLATFORM_TARGET_MODEL.md"
    scope: >
      家庭需求 N0-N8 全链路的端到端垂直切片：N0 信号（NeedSignal）→ N1 澄清
      （FamilyNeed）→ N2 分级（NeedProfile，含 Triple P 式五级 InterventionTier
      分级判断 `derive_intervention_tier`）→ N3 方案设计（SolutionDraft，只读的
      Commerce/Service/Course 供给引用端口 `SupplyReferencePort` 经
      `CompositeSupplyAdapter` 路由到 PRODUCT/SERVICE/SOLUTION 三种形态各自的
      适配器）→ N4 资源组织（`AssignmentPlan`，家长确认方案后落一条可查询的
      "资源分配依据"事实，`authorization_basis` 明确记录这是家长自己批准的，
      不是 AI 决定的）→ N5 交付执行（跨域履约协调器
      `backend/apps/family_api/orchestration/need_fulfillment_flow.py`，SERVICE
      形态在预约前先经 FGCN 分派授权闸门，见下）→ N6/N7 质量验收与结果确认
      （`FamilyConfirmedOutcome`，家庭本人确认 HELPED/PARTIALLY_HELPED/
      DID_NOT_HELP，AI/SYSTEM 身份被显式拒绝，见 R9）→ N8 新需求回流
      （DID_NOT_HELP 时复用 `capture_signal` 真实开出一条新 `NeedSignal`，
      `causation_id` 指回原需求，不新建并行的回流管道）。
      **FGCN 分派授权闸门**（`backend/apps/family_api/orchestration/
      fgcn_assignment_flow.py`）：当且仅当能拿到真实的 N6/N7 自助失败证据
      （`FamilyConfirmedOutcome.decision=DID_NOT_HELP`）时，SERVICE 预约前先走
      FGCN 的 S-01 场景（`open_service_case`/`create_task`/
      `execute_task_assignment_named_action`）——AI 只能建议候选教师
      （ModelGateway 生成候选），只有家长在 Human Gate 上批准才产生真实
      `TaskAssignment`；没有该证据的正常预约保持原有直接预约行为，不强制经过
      FGCN。dev 环境用内存版 `FGCNEngine`（同步），生产/真实验证路径用
      `application.py` 的异步 durable 函数 + `SqlAlchemyFGCNRepository`，已在
      真实 PostgreSQL 上验证跨会话可查询（见 service_fgcn_collaboration 条目）。
      **AI Coach**（`backend/intelligence/experience/family_ai_coach.py` +
      `backend/domains/family_need/application/ai_coach.py`）：家长可对当前
      need 发起苏格拉底式引导对话，回复内容 100% 由真实模型（生产可配置
      OpenAI 兼容 provider，已用 DeepSeek 真实验证）生成，JSON schema 故意不含
      "answer"/"solution" 字段以在结构层面禁止模型直接给方案；输出标注
      `AI_PERSPECTIVE_NOT_FAMILY_FACT_GUIDANCE_NOT_ANSWER`，不经 Human Gate
      （纯展示型 Perspective，不产生任何业务状态变更），AI 用例文档见
      `docs/05_ai/AI_USE_CASES/family-ai-coach.md`。
      领域事实由家庭/人工/受治理系统动作写入，AI 只能生成草案或视角，不能直接
      写入需求事实；商品订单、服务预约、课程内容各自的事实仍由 commerce /
      service_booking / product_intelligence 领域拥有，本域只持有跨域引用与
      履约协调结果。
    tests:
      - tests/domains/family_need/test_domain_contract.py
      - tests/domains/family_need/test_postgres_repository_integration.py
      - tests/domains/family_need/test_actor_resolver_integration.py
      - tests/domains/family_need/test_commerce_supply_adapter.py
      - tests/domains/family_need/test_service_supply_adapter.py
      - tests/domains/family_need/test_ai_coach_route.py
      - tests/apps/family_api/test_family_need_routes.py
      - tests/apps/family_api/test_need_fulfillment_e2e.py
      - tests/domains/service/fgcn/test_family_need_durable_assignment_postgres.py
      - tests/intelligence/experience/test_family_ai_coach_real_model.py
    known_gaps:
      - "生产 PostgreSQL 仓储（postgres_repository.py）与 SqlAlchemyFamilyNeedActorResolver
         已实现并在真实 PostgreSQL（Docker docker-compose.dev.yml）上验证 round-trip/
         乐观锁/幂等约束通过；生产环境挂载分支（_mount_family_need）已写但尚未在真实
         生产部署中启用过"
