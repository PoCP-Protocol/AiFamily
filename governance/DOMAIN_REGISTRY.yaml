# AiFamily Domain Registry
# 每个业务能力在 AiFamily 中只允许有一个正式实现位置。见 governance/REPOSITORY_CONSTITUTION.md R2。
# 本登记表由 governance/MIGRATION_MANIFEST.yaml 中 disposition = MIGRATE 或 REIMPLEMENT 的条目导出。
# 架构测试 tests/architecture/test_domain_registry.py 强制：
#   - 同一 capability 不得出现两次
#   - 同一 capability 不得声明两个 canonical_path（canonical_path 必须是标量，不是列表）
#
# ---------------------------------------------------------------------------
# 状态声明（2026-08-29 校正，取代原 "Wave 0：本表全部 NOT_STARTED" 声明）
# ---------------------------------------------------------------------------
# 原头部声明已与磁盘实况漂移：backend/platform/{identity,authorization,consent,audit,
# idempotency,persistence}、backend/apps/family_api、backend/packages/contracts、
# 以及 5 个 backend/domains/* 均已有真实代码（uv run pytest = 57 passed）。
# 本次校正逐条刷新 status，使 registry 与磁盘一致。
#
# status 词表与 docs/00_system/CURRENT_DOMAIN_MAP.md §0 保持同一套语言：
#   NOT_STARTED              canonical_path 不存在或为空
#   MIGRATED_STRUCTURE_ONLY  有文件，但是空壳 / stub / 全 NotImplementedError
#   MIGRATED_UNTESTED        有实质代码，零验收测试（违反 R4，不得称为能力）
#   MIGRATED_TESTED          有实质代码 + 可在 CI 真实运行的测试（满足 R4）
#   PRODUCTION               已真正上线服务真实家庭
#   DONE                     仅用于文档类 capability（其交付物是文档，不是运行代码）
#
# 当前**没有任何一个 capability 是 PRODUCTION**。业务 API、数据库 baseline、
# 远端 CI 三项前提全部缺失，见 docs/00_system/CURRENT_SYSTEM_BASELINE.md §4。
# MIGRATED_STRUCTURE_ONLY / MIGRATED_UNTESTED 不表示"接近完成"，按 R4 等价于
# "能力不存在，但代码占了位置"。代码行数不是成熟度。
