    continuation_decision: >
      续用（非重写）。复核依据：三个文件的每条 Literal 与每条 assert 都能在
      database/baseline/0035_family_service_booking_objects.sql 找到对应的 enum
      或 CHECK 约束（逐条核对：五个 status enum、source_page_id 四值白名单、
