      即它不是凭空设计而是对已 baseline 的 SQL 的忠实映射；且 domain 层无
      FastAPI / SQLAlchemy 导入，符合四层规则。重写会产出同一份内容并丢掉
      value_objects 里关于"服务方质量评价 ≠ 家庭打分"的 R9 边界论证。
      唯一改动：新增 entities.py（原缺失）。
    evidence:
      - "四层齐全：domain（entities/errors/policies/value_objects）+ application（commands/queries/read_models/ports/context）+ infrastructure（fake_repository/sqlalchemy_models/sqlalchemy_repository）+ api（routes/requests/dependencies）"
