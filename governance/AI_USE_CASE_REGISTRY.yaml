versioned_assets:
  prompt:
    registry: governance/AI_USE_CASE_REGISTRY.yaml
    required_fields: [id, version, owner, purpose, input_contract, output_schema_ref, safety_policy, status]
    publish_gate: evaluation_passed_and_owner_approved
  schema:
    registry: governance/AI_USE_CASE_REGISTRY.yaml
    required_fields: [id, version, fields, validation_rules, compatibility, status]
    publish_gate: contract_tests_passed
  knowledge:
    registry: governance/AI_USE_CASE_REGISTRY.yaml
    required_fields: [id, version, source, license, scope, expires_at, status]
    publish_gate: source_license_and_safety_review
  provenance:
    required_fields: [request_id, agent_id, prompt_version, schema_version, knowledge_versions, model_attempt_id, evidence_refs, created_at]
    initial_output_status: DRAFT
    immutable_after_creation: true

release_gates:
  - gate: contract
    checks: [schema_validation, provenance_complete, draft_only]
  - gate: safety
    checks: [minor_data_minimization, prohibited_output_scan, high_risk_human_gate]
  - gate: quality
    checks: [grounding, usefulness, workflow_completion, regression]
  - gate: operations
    checks: [trace_and_cost_recorded, rollback_ready, environment_parity_verified]
