deferral_rationale: >
  Official MuseTalk is a real-time high-fidelity video dubbing / lip-sync model
  that modifies a face region driven by audio. Complete virtual-human solutions
  are described as MuseV (or other) video + MuseTalk. Config can accept an image
  file as video_path, but that is not the same Gate1 class as engines whose
  primary fair input is a single static reference portrait + fixed audio producing
  a full talking-person video. Deferred from ACTIVE Gate1 shortlist; retain for
  later lipsync / realtime dubbing evaluation.
future_value: >
  High-quality lipsync on existing video; realtime dubbing potential.
