# AiFamily Capability Registry
#
# 这份 registry 的目的是把文档与代码真正打通：一个 capability 一行，
# 从 domain / actor / command / api / code / events / 治理要求 / status
# 一路可追溯到测试。它回答的问题是：
#
#   「这个能力属于哪个域、谁能调用、走哪个 Named Action、代码在哪、
#     需不需要 consent/audit/idempotency、有没有 AI 参与、现在能用吗」
#
# 与其它 registry 的分工：
#   DOMAIN_REGISTRY.yaml     — 域的唯一实现位置（R2：一个域一个位置）
#   MIGRATION_MANIFEST.yaml  — 每项资产的迁移处置（R3：无登记不得入仓）
#   CAPABILITY_REGISTRY.yaml — 本文件：能力级的端到端映射
#
# Traceability 目标链（见 docs/12_governance/DOCUMENT_GOVERNANCE.md）：
#   Strategy → Business Capability → Product Capability → Domain
#            → Command/Event → API → Code → Test → Metric
#
# ⚠️ 当前状态诚实声明：本 registry 目前只登记**真实存在的** capability。
# AiFamily 尚无任何业务 API，因此下方只有平台内核能力与健康检查。
# 业务能力（CompleteGrowthAction 等）在对应 Batch 落地时逐条追加，
# 不预先登记未实现的能力 —— 预登记会让本文件变成愿望清单，
# 而 registry 的全部价值在于它描述事实。

schema_version: "1.0"
updated: "2026-08-29"

# ---------------------------------------------------------------------------
# 合法取值（供架构测试校验）
# ---------------------------------------------------------------------------
enums:
  status:
    - PLANNED                    # 已设计未编码
    - IMPLEMENTED_UNTESTED       # 有代码无测试（R4：不得声称可用）
    - IMPLEMENTED_TESTED         # 有代码有测试，但未接入生产流量
    - PRODUCTION                 # 真实承载生产流量（当前无任何能力达到）
  actor_type:
    - guardian                   # 家长/监护人
    - child                      # 未成年成员
    - operator                   # 平台运营
    - teacher                    # 教师/专家
    - system                     # 系统内部调度
    - ai                         # AI Agent（永不可写 canonical 状态，见 R9）

  # 上游归属：每个 capability 必须回答"我服务哪个业务能力"。
  # 取值来源 docs/02_business/BUSINESS_CAPABILITY_MAP.md 与
  # BUSINESS_ARCHITECTURE.md §1.3/§3；不是自由文本，新增取值须同时改这里、
  # 业务文档、以及 tools/architecture/check_traceability.py 的报告基线。
  #
  # 为什么是显式字段而不是从 domain 推导：domain 只复述代码位置
  # （domains/membership → membership），推导出的"归属"是同义反复，
  # 永远不会断链，也就永远证明不了任何事。上游链的价值恰在于**有人写下了
  # 这段代码为什么存在**。见 DOCUMENT_GOVERNANCE.md §6「向上」用法。
  business_capability:
    - PLATFORM_INTERNAL          # 平台内核原语，不直接服务某项业务能力；
                                 # 上溯终点是 REPOSITORY_CONSTITUTION 与
                                 # docs/06_platform/，不是业务能力地图
    - family_growth_assessment   # 入口层：家庭/父母成长测评（BUSINESS_ARCHITECTURE §3.2 入口层）
    - growth_plan_delivery       # 核心层：90天家庭成长计划的交付闭环（§3.2 核心层）
    - membership_and_benefits    # 生态层：会员与权益（§3.2 生态层，白皮书 Slide 8 订阅层）
    - product_intelligence       # 运营侧：市场信号→洞察→假设→验证（非家庭侧业务能力）
    - service_delivery           # 服务层：咨询、沙龙、城市活动等由真人交付的服务
                                 # （BUSINESS_ARCHITECTURE §商业层级表「服务层」一行）。
                                 # 与 membership_and_benefits 分开：会员是关系深度，
                                 # 服务是一次具体交付，两者不得互相换算
    - platform_runtime           # 运行时可用性（健康/就绪探针等运维面）

# ---------------------------------------------------------------------------
# 平台内核能力（Wave 1，非业务域）
# ---------------------------------------------------------------------------
capabilities:

  - capability: resolve_actor_context
    business_capability: PLATFORM_INTERNAL
    domain: platform/identity
    purpose: 构造不可变的 ActorContext / TenantContext，回答"谁在什么租户下以什么身份操作"
    actor: [system]
    command: null                # 平台原语，非业务 Named Action
    api: null
    code:
      domain: backend/platform/identity/context.py
    tests:
      - tests/platform/identity/
    consent: {required: false}
    audit: {required: false, note: "本身不改状态；它是审计记录的输入"}
    idempotency: {required: false}
    ai:
      involved: false
      note: >
        ActorContext 必须能诚实回答 is_ai()。这是 R9 的执行前提 ——
        上层据此拒绝 AI actor 写 canonical 状态。
    status: IMPLEMENTED_TESTED

  - capability: authorize_action
    business_capability: PLATFORM_INTERNAL
    domain: platform/authorization
    purpose: 给定 (actor, action, resource) 返回 ALLOW/DENY，未注册组合 fail-closed
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/authorization/policy.py
    tests:
      - tests/platform/authorization/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false}
    ai:
      involved: false
      note: "human_only=True 的 action 对 AI actor 无条件拒绝"
    status: IMPLEMENTED_TESTED
    reference_implementation: "50_开发_dev/apps/api/src/modules/auth/family-authorization.policy.ts"

  - capability: check_consent
    business_capability: PLATFORM_INTERNAL
    domain: platform/consent
    purpose: 按 purpose 校验 consent 是否有效；撤回立即生效，无缓存
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/consent/models.py
      application: backend/platform/consent/gate.py
    tests:
      - tests/platform/consent/
    consent: {required: false, note: "它就是 consent 机制本身"}
    audit: {required: false}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    compliance_refs:
      - "docs/12_governance/COMPLIANCE_HARD_CONSTRAINTS.md §5 (禁止一次性打包勾选)"
    known_gaps:
      - "尚未支持《儿童个人信息网络保护规定》第10条要求的『同意界面同时提供拒绝选项』"
      - "尚未支持目的变更触发重新同意（第14条）"

  - capability: record_audit_event
    business_capability: PLATFORM_INTERNAL
    domain: platform/audit
    purpose: 记录 actor/tenant/action/resource/before/after/reason/correlation_id/timestamp
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/audit/models.py
      application: backend/platform/audit/recorder.py
    tests:
      - tests/platform/audit/
    consent: {required: false}
    audit: {required: false, note: "它就是审计机制本身"}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    known_gaps:
      - >
        当前只覆盖状态变更（R6）。《未成年人网络保护条例》第36条要求
        **读取访问**也须留痕，尚未实现 —— 见 COMPLIANCE_HARD_CONSTRAINTS.md §8。
      - "flush 到 DB 的接口存在但真实 audit 表尚未建（Batch 3 Family Core 时落地）"

  - capability: reserve_idempotency_key
    business_capability: PLATFORM_INTERNAL
    domain: platform/idempotency
    purpose: 同一 idempotency key 的重复请求被拒绝，保证命令只生效一次
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/idempotency/keys.py
    tests:
      - tests/platform/idempotency/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false, note: "它就是幂等机制本身"}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    known_gaps:
      - "仅有 InMemoryIdempotencyStore；持久化实现待 Batch 3"

  - capability: unit_of_work_transaction
    business_capability: PLATFORM_INTERNAL
    domain: platform/persistence
    purpose: 同一 UoW 内的多个 repository 操作要么全提交要么全回滚
    actor: [system]
    command: null
    api: null
    code:
      infrastructure: backend/platform/persistence/unit_of_work.py
      session: backend/platform/persistence/session.py
    tests:
      - tests/platform/persistence/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED

# ---------------------------------------------------------------------------
# AI Runtime 能力（backend/intelligence，R10：各一份）
# ---------------------------------------------------------------------------
# 这两条是 AI 能力的前置基础设施，本身不服务某一项业务能力——它们约束的是
# **所有**业务能力将来怎么调模型。故 business_capability = PLATFORM_INTERNAL，
# 上溯终点是宪章 R7/R9/R10 与 COMPLIANCE_HARD_CONSTRAINTS.md，不是业务能力地图。

  - capability: admit_model_provider
    business_capability: PLATFORM_INTERNAL
    domain: intelligence/model_gateway
    purpose: >
      给定 (provider_id, data_class, environment) 返回准入的 ProviderRecord 或
      POLICY_REJECTED。未登记 / 状态未获批 / 环境不符 / 数据类别越权 / 第16条手续缺失
      一律 fail-closed，无宽松分支。
    actor: [system]
    command: null                # 平台原语，非业务 Named Action
    api: null
    code:
      domain: backend/intelligence/model_gateway/provider_registry.py
    tests:
      - tests/intelligence/model_gateway/test_provider_admission.py
    consent:
      required: false
      note: >
        准入检查的是"这个供应商能不能处理这一类数据"，不替代 consent。
        涉家庭/未成年人数据的调用方仍须自行过 platform/consent（第14条目的变更须重新同意）。
    audit:
      required: true
      note: "被拒绝的准入不产生 attempt 记录（没有外呼就不谎报外呼）；通过后由 attempt 账本留痕"
    idempotency: {required: false}
    ai:
      involved: false
      note: "它是约束 AI 外呼的机制本身，不含 AI 推断"
    status: IMPLEMENTED_TESTED
    compliance_refs:
      - >
        COMPLIANCE_HARD_CONSTRAINTS.md §7：《儿童个人信息网络保护规定》第16条
        委托第三方处理须先安全评估 + 签委托协议 + 不得超出授权范围 + **不得转委托** +
        解约时删除。五项各对应一个 ProviderRecord 字段并在 admit() 执行。
      - "§11.1：不得转委托需法务与商务介入，非纯技术决定"
    known_gaps:
      - >
        **零个外部供应商通过准入**。sub_delegates 为三态（true/false/未确立），
        未确立按禁止处理——因此 openai-compatible-unassessed 对任何数据类别都被拒。
        这是当前真实的治理状态，不是待填的占位。
      - >
        不做转委托的**技术**核验（无法从代码判断厂商是否再分包），只强制"必须有人
        填过这个字段且答案是 false"。答案的真实性依赖法务的评估结论。

  - capability: generate_model_draft
    business_capability: PLATFORM_INTERNAL
    domain: intelligence/model_gateway
    purpose: >
      经准入后对单个 provider 发起一次结构化生成：外呼前登记 attempt → 双层 timeout →
      JSON 解析 + schema 校验 → 强制完整 AiProvenance → 返回 ModelDraft。
      任何失败一律抛 ModelGatewayError，绝不返回原始模型文本，绝不降级。
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/intelligence/model_gateway/contracts.py
      application: backend/intelligence/model_gateway/gateway.py
      infrastructure: backend/intelligence/model_gateway/providers/
    tests:
      - tests/intelligence/model_gateway/test_fail_closed.py
      - tests/intelligence/model_gateway/test_provenance_and_draft.py
      - tests/intelligence/model_gateway/test_openai_compatible_provider.py
      - tests/intelligence/model_gateway/test_routing_and_attempts.py
      - tests/architecture/test_ai_runtime_isolation.py
    consent:
      required: false
      note: "网关本身不判定 consent；调用方在构造 StructuredRequest 前须自行过闸"
    audit:
      required: true
      note: >
        每次外呼在**调用前**写入 attempt（STARTED），成功/失败/超时回写。
        顺序是刻意的：写在调用后的话，超时与进程崩溃就不留痕，审计轨迹里只剩成功。
    idempotency:
      required: false
      note: >
        automatic_retry = 0，因此不需要幂等键去重。retry=0 沿用源仓库决定并追加本仓库
        自己的理由：重试会把"经过几个受托处理者"变成网络天气的函数（第16条按处理者逐个
        计算义务），且反复重试直到模型吐出合法 JSON 是在优化"produce an answer"，
        与 R9 直接冲突。
    ai:
      involved: true
      constraint: >
        输出恒为 ModelDraft（status=DRAFT），may_mutate_business_state 是只读 property
        恒 False——不是带 False 默认值的字段，因此 dataclasses.replace 也改不到。
        backend/intelligence/ 下不得 import 业务域 repository 或 platform/persistence，
        由 tests/architecture/test_ai_runtime_isolation.py 机械强制（已验证会咬人）。
        canonical 写入只能经业务域自己的 Named Action + 人工闸门（R8/R9）。
    status: IMPLEMENTED_TESTED
    reference_implementation: "50_开发_dev/packages/ai-gateway/src/index.ts（894行，作为设计参考重译为 Python，未搬 TS 代码结构）"
    compliance_refs:
      - >
        COMPLIANCE_HARD_CONSTRAINTS.md §2：PIPL 第24条要求自动化决策可解释，
        故 provenance 记录 model / model_version / prompt_version /
        context_snapshot_ref / confidence / latency_ms / provider_id 为**强制**。
        AiProvenance 的身份字段缺一即构造失败。
      - "R9 / AI_NATIVE_PRINCIPLES.md §2：AI 原生不放宽约束，AI 是主干所以约束更严"
    known_gaps:
      - "Attempt 账本仅进程内（InMemoryAttemptSink），无持久化表。持久化归 T-07 的读取留痕扩展。"
      - "schema 校验是 JSON Schema 子集（type/required/properties/items/enum）；引入 jsonschema 属 R11 决策需 ADR。"
      - "confidence 依赖 provider 上报，多数 OpenAI 兼容厂商不报，故记为 None——刻意不编造数值填进合规记录。"
      - "无 Prompt Registry：prompt_version / context_snapshot_ref 由调用方给出，网关只强制非空，不校验其指向真实存在的 prompt 或快照。"
      - "无调用方：无业务域使用、无 HTTP 路由。按 R4 是'能力存在且有测试'，不是'已投入使用'。"

