# AiFamily Capability Registry
#
# 这份 registry 的目的是把文档与代码真正打通：一个 capability 一行，
# 从 domain / actor / command / api / code / events / 治理要求 / status
# 一路可追溯到测试。它回答的问题是：
#
#   「这个能力属于哪个域、谁能调用、走哪个 Named Action、代码在哪、
#     需不需要 consent/audit/idempotency、有没有 AI 参与、现在能用吗」
#
# 与其它 registry 的分工：
#   DOMAIN_REGISTRY.yaml     — 域的唯一实现位置（R2：一个域一个位置）
#   MIGRATION_MANIFEST.yaml  — 每项资产的迁移处置（R3：无登记不得入仓）
#   CAPABILITY_REGISTRY.yaml — 本文件：能力级的端到端映射
#
# Traceability 目标链（见 docs/12_governance/DOCUMENT_GOVERNANCE.md）：
#   Strategy → Business Capability → Product Capability → Domain
#            → Command/Event → API → Code → Test → Metric
#
# ⚠️ 当前状态诚实声明：本 registry 目前只登记**真实存在的** capability。
# AiFamily 尚无任何业务 API，因此下方只有平台内核能力与健康检查。
# 业务能力（CompleteGrowthAction 等）在对应 Batch 落地时逐条追加，
# 不预先登记未实现的能力 —— 预登记会让本文件变成愿望清单，
# 而 registry 的全部价值在于它描述事实。

schema_version: "1.0"
updated: "2026-08-29"

# ---------------------------------------------------------------------------
# 合法取值（供架构测试校验）
# ---------------------------------------------------------------------------
enums:
  status:
    - PLANNED                    # 已设计未编码
    - IMPLEMENTED_UNTESTED       # 有代码无测试（R4：不得声称可用）
    - IMPLEMENTED_TESTED         # 有代码有测试，但未接入生产流量
    - PRODUCTION                 # 真实承载生产流量（当前无任何能力达到）
  actor_type:
    - guardian                   # 家长/监护人
    - child                      # 未成年成员
    - operator                   # 平台运营
    - teacher                    # 教师/专家
    - system                     # 系统内部调度
    - ai                         # AI Agent（永不可写 canonical 状态，见 R9）

  # 上游归属：每个 capability 必须回答"我服务哪个业务能力"。
  # 取值来源 docs/02_business/BUSINESS_CAPABILITY_MAP.md 与
  # BUSINESS_ARCHITECTURE.md §1.3/§3；不是自由文本，新增取值须同时改这里、
  # 业务文档、以及 tools/architecture/check_traceability.py 的报告基线。
  #
  # 为什么是显式字段而不是从 domain 推导：domain 只复述代码位置
  # （domains/membership → membership），推导出的"归属"是同义反复，
  # 永远不会断链，也就永远证明不了任何事。上游链的价值恰在于**有人写下了
  # 这段代码为什么存在**。见 DOCUMENT_GOVERNANCE.md §6「向上」用法。
  business_capability:
    - PLATFORM_INTERNAL          # 平台内核原语，不直接服务某项业务能力；
                                 # 上溯终点是 REPOSITORY_CONSTITUTION 与
                                 # docs/06_platform/，不是业务能力地图
    - family_growth_assessment   # 入口层：家庭/父母成长测评（BUSINESS_ARCHITECTURE §3.2 入口层）
    - growth_plan_delivery       # 核心层：90天家庭成长计划的交付闭环（§3.2 核心层）
    - membership_and_benefits    # 生态层：会员与权益（§3.2 生态层，白皮书 Slide 8 订阅层）
    - product_intelligence       # 运营侧：市场信号→洞察→假设→验证（非家庭侧业务能力）
    - platform_runtime           # 运行时可用性（健康/就绪探针等运维面）

# ---------------------------------------------------------------------------
# 平台内核能力（Wave 1，非业务域）
# ---------------------------------------------------------------------------
capabilities:

  - capability: resolve_actor_context
    business_capability: PLATFORM_INTERNAL
    domain: platform/identity
    purpose: 构造不可变的 ActorContext / TenantContext，回答"谁在什么租户下以什么身份操作"
    actor: [system]
    command: null                # 平台原语，非业务 Named Action
    api: null
    code:
      domain: backend/platform/identity/context.py
    tests:
      - tests/platform/identity/
    consent: {required: false}
    audit: {required: false, note: "本身不改状态；它是审计记录的输入"}
    idempotency: {required: false}
    ai:
      involved: false
      note: >
        ActorContext 必须能诚实回答 is_ai()。这是 R9 的执行前提 ——
        上层据此拒绝 AI actor 写 canonical 状态。
    status: IMPLEMENTED_TESTED

  - capability: authorize_action
    business_capability: PLATFORM_INTERNAL
    domain: platform/authorization
    purpose: 给定 (actor, action, resource) 返回 ALLOW/DENY，未注册组合 fail-closed
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/authorization/policy.py
    tests:
      - tests/platform/authorization/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false}
    ai:
      involved: false
      note: "human_only=True 的 action 对 AI actor 无条件拒绝"
    status: IMPLEMENTED_TESTED
    reference_implementation: "50_开发_dev/apps/api/src/modules/auth/family-authorization.policy.ts"

  - capability: check_consent
    business_capability: PLATFORM_INTERNAL
    domain: platform/consent
    purpose: 按 purpose 校验 consent 是否有效；撤回立即生效，无缓存
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/consent/models.py
      application: backend/platform/consent/gate.py
    tests:
      - tests/platform/consent/
    consent: {required: false, note: "它就是 consent 机制本身"}
    audit: {required: false}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    compliance_refs:
      - "docs/12_governance/COMPLIANCE_HARD_CONSTRAINTS.md §5 (禁止一次性打包勾选)"
    known_gaps:
      - "尚未支持《儿童个人信息网络保护规定》第10条要求的『同意界面同时提供拒绝选项』"
      - "尚未支持目的变更触发重新同意（第14条）"

  - capability: record_audit_event
    business_capability: PLATFORM_INTERNAL
    domain: platform/audit
    purpose: 记录 actor/tenant/action/resource/before/after/reason/correlation_id/timestamp
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/audit/models.py
      application: backend/platform/audit/recorder.py
    tests:
      - tests/platform/audit/
    consent: {required: false}
    audit: {required: false, note: "它就是审计机制本身"}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    known_gaps:
      - >
        当前只覆盖状态变更（R6）。《未成年人网络保护条例》第36条要求
        **读取访问**也须留痕，尚未实现 —— 见 COMPLIANCE_HARD_CONSTRAINTS.md §8。
      - "flush 到 DB 的接口存在但真实 audit 表尚未建（Batch 3 Family Core 时落地）"

  - capability: reserve_idempotency_key
    business_capability: PLATFORM_INTERNAL
    domain: platform/idempotency
    purpose: 同一 idempotency key 的重复请求被拒绝，保证命令只生效一次
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/idempotency/keys.py
    tests:
      - tests/platform/idempotency/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false, note: "它就是幂等机制本身"}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    known_gaps:
      - "仅有 InMemoryIdempotencyStore；持久化实现待 Batch 3"

  - capability: unit_of_work_transaction
    business_capability: PLATFORM_INTERNAL
    domain: platform/persistence
    purpose: 同一 UoW 内的多个 repository 操作要么全提交要么全回滚
    actor: [system]
    command: null
    api: null
    code:
      infrastructure: backend/platform/persistence/unit_of_work.py
      session: backend/platform/persistence/session.py
    tests:
      - tests/platform/persistence/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED

# ---------------------------------------------------------------------------
# 运行时能力（Wave 1）
# ---------------------------------------------------------------------------

  - capability: health_check
    business_capability: platform_runtime
    domain: apps/family_api
    purpose: 存活探针
    actor: [system]
    command: null
    api: "GET /health"
    code:
      api: backend/apps/family_api/routes.py
    tests:
      - tests/apps/family_api/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED

  - capability: readiness_check
    business_capability: platform_runtime
    domain: apps/family_api
    purpose: 就绪探针，真实 ping 数据库连接
    actor: [system]
    command: null
    api: "GET /ready"
    code:
      api: backend/apps/family_api/routes.py
    tests:
      - tests/apps/family_api/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED

# ---------------------------------------------------------------------------
# 业务域能力（已迁入代码，但均未接入 API）
# ---------------------------------------------------------------------------

  - capability: membership_tier_lifecycle
    business_capability: membership_and_benefits
    domain: domains/membership
    purpose: 会籍档位建立/升降/续费/过期，权益发放-占用-核销与台账
    actor: [guardian, operator]
    command:
      - activate_membership_tier
      - renew_membership_period
      - expire_membership_period
      - grant_membership_benefit
      - reserve_membership_benefit
      - consume_membership_benefit
      - subscribe_membership
    # 纠正（T-08 检查器发现）：原先写 `api: null  # ⚠️ 无 routes.py，未挂载到 family_api`，
    # 这是**事实错误** —— backend/domains/membership/api/routes.py 存在，且
    # backend/apps/family_api/main.py:29 确实 include_router(membership_router)。
    # 注意"已挂载"≠"可用"：其 get_repository / get_action_context 依赖按设计抛异常
    # （见 main.py 注释与 DOMAIN_REGISTRY membership.known_gaps），端点在依赖层
    # fail-closed。登记路由是为了 registry 描述事实，不是宣称能力可用。
    api:
      - "POST /membership/subscriptions"
      - "POST /membership/tier-activations"
      - "POST /membership/period-renewals"
      - "POST /membership/period-expirations"
      - "POST /membership/benefit-grants"
      - "POST /membership/benefit-reservations"
      - "POST /membership/benefit-reservations/{benefit_reservation_id}/release"
      - "POST /membership/benefit-consumptions"
      - "POST /membership/benefit-revocations"
      - "GET /membership/projection"
      - "GET /membership/screens/{surface_id}"
    code:
      domain: backend/domains/membership/domain/
      application: backend/domains/membership/application/
      infrastructure: backend/domains/membership/infrastructure/
      api: backend/domains/membership/api/
    tests:
      - tests/domains/membership/test_acceptance_chain.py
      - tests/domains/membership/test_tier_field_guardrail.py
    consent:
      required: true
      note: "subscribe_membership 接受 consent_ref"
    audit:
      required: true
      note: "档位转换记录 direction/activation_source/decided_by，可回溯『为什么是这个档位』"
    idempotency:
      required: true
      note: "ActionContext.idempotency_key，仓储层按 key 去重"
    ai:
      involved: false
      note: >
        assert_human_actor 在域边界拒绝 ai: 前缀 actor —— AI 可以建议升档，
        不能授予档位。对应六项战略原则第5条。
    status: IMPLEMENTED_TESTED
    compliance_refs:
      - >
        COMPLIANCE_HARD_CONSTRAINTS.md §3：会员权益**不得**基于画像向孩子端
        自动化营销（《未成年人网络保护条例》24条3款绝对禁止）。
      - "§4：消费限额（44条）在教育类未列举但不宜依赖此漏洞"
    defect_history:
      - >
        renew_membership_period() 曾在任何调用下都抛 tier_transition_is_noop ——
        policies.py 的同档位 no-op 检查只豁免 ADMIN_MANUAL_GRANT，漏了
        ANNUAL_MEMBERSHIP_RENEWED，而续费按 baseline invariant 8 就是同档位追加。
        源仓库零测试所以一直没发现，本仓库补测试后立即暴露。
        修复：引入 SAME_TIER_ALLOWED_SOURCES 白名单。

  - capability: product_intelligence_hypothesis
    business_capability: product_intelligence
    domain: domains/product_intelligence
    purpose: 市场信号→洞察→假设→验证的产品智能链
    actor: [operator]
    command:
      - validate_growth_hypothesis
    api: null                    # ⚠️ routes.py 存在但自述"未挂载到任何 app"
    code:
      domain: backend/domains/product_intelligence/domain/
      application: backend/domains/product_intelligence/application/
      infrastructure: backend/domains/product_intelligence/infrastructure/
      api: backend/domains/product_intelligence/api/routes.py
    tests:
      - backend/domains/product_intelligence/tests/test_acceptance_chain.py
      - backend/domains/product_intelligence/tests/test_hypothesis_validation_guardrail.py
    consent: {required: false, note: "运营侧能力，不涉及家庭数据"}
    audit: {required: true}
    idempotency: {required: false}
    ai:
      involved: true
      constraint: >
        AI 生成的 hypothesis 初始 status=DRAFT，且**没有任何代码路径**可自动置为
        VALIDATED —— test_hypothesis_validation_guardrail.py 断言
        human_actor="ai:*" 调用 validate 会被拒绝。这是 R9 的真实落地样例。
    status: IMPLEMENTED_TESTED
    known_gaps:
      - "无 Postgres 集成测试，仅 SQLite 内存库"
      - "router 未挂载，实际不可通过 HTTP 调用"

