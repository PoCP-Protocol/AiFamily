# ---------------------------------------------------------------------------
# 业务域能力
# ---------------------------------------------------------------------------

  - capability: dev_account_session
    business_capability: PLATFORM_INTERNAL
    domain: domains/assessment
    purpose: >
      开发期账户会话：签发 Bearer token 并绑定 account/family，供 mobile 前端
      走通家庭作用域请求。这不是生产身份体系。
    actor: [guardian, system]
    command: null
    api:
      - "POST /auth/account-session"
      - "GET /auth/me"
      - "GET /auth/contexts"
      - "POST /auth/session/revoke"
    code:
      api: backend/domains/assessment/api/dev_auth.py
    tests:
      - tests/apps/family_api/test_assessment_routes.py
    consent: {required: false}
    audit:
      required: true
      note: "会话签发与吊销均记 AuditEvent（api.py 的 auth.session_created / auth.session_revoked）"
    idempotency:
      required: true
      note: "idempotency-key header 必填，缺失返回 400"
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    r2_note: >
      代码物理位于 domains/assessment 但 business_capability 标 PLATFORM_INTERNAL ——
      这是**有意记录的错位**，不是笔误。认证不属于测评域，它落在这里只因为 assessment
      是第一个需要 HTTP 会话的 vertical slice。真正的身份体系是 auth_identity
      （DOMAIN_REGISTRY 中 status: NOT_STARTED），届时本能力应迁出并退役。
      在此之前 registry 必须诚实描述它现在在哪，而不是描述它应该在哪。
    known_gaps:
      - "token 存在进程内 dict（AssessmentApiState.tokens），重启即失效，非持久化会话"
      - "无 OTP/真实登录流程；external_ref 直接换 token，仅限 dev"
      - "expires_at 硬编码 2099-01-01，未实现真实过期"

  - capability: assessment_session_to_hypothesis
    business_capability: family_growth_assessment
    domain: domains/assessment
    purpose: >
      UI-02 → UI-03 测评链路：建会话 → 逐题作答 → 提交 → 生成 GrowthHypothesis
      → 人工确认后产出 GrowthIntent。确定性解读，无 AI 参与。
    actor: [guardian]
    command:
      - start
      - response
      - submit
      - generate_hypothesis
      - decide
    api:
      - "GET /families/{family_id}/ui/02/assessment"
      - "POST /families/{family_id}/assessments/sessions"
      - "POST /families/{family_id}/assessments/sessions/{session_id}/responses"
      - "POST /families/{family_id}/assessments/sessions/{session_id}/submit"
      - "GET /families/{family_id}/ui/03/growth-hypothesis"
      - "POST /families/{family_id}/assessments/{session_id}/growth-hypothesis"
      - "POST /families/{family_id}/growth-hypotheses/decisions"
    code:
      api: backend/domains/assessment/api/routes.py
      application: backend/domains/assessment/application/
      domain: backend/domains/assessment/domain/
      infrastructure: backend/domains/assessment/infrastructure/
    tests:
      - tests/domains/assessment/test_assessment_flow.py
      - tests/domains/assessment/test_interpretation_boundary.py
      - tests/domains/assessment/test_transactional_outbox_invariant.py
      - tests/apps/family_api/test_assessment_routes.py
    consent:
      required: true
      note: >
        **当前未执行**。测评采集未成年人数据，按 COMPLIANCE_HARD_CONSTRAINTS §1
        属敏感信息处理，须过必要性检验且绑定目的与留存期限。
        代码目前不调用 ConsentGate —— 这是 known_gaps 第一条，不是已满足项。
    audit:
      required: true
      note: "全链路记 AuditEvent，test_assessment_routes 断言 ≥5 条事件"
    idempotency:
      required: true
      note: "所有 mutation 需 idempotency-key，重放返回同一 receipt"
    ai:
      involved: false
      constraint: >
        当前是确定性解读器，非 AI。Hypothesis 的 canonical_fact 恒为 false
        （test_assessment_routes 断言），即假设永不自动成为事实 —— R9 的执行点。
        接入 AI 解读须经 backend/intelligence/model_gateway，且不得原样搬迁源仓库
        的 claude_interpretation.py。
    status: IMPLEMENTED_TESTED
    known_gaps:
      - "**未接 ConsentGate**：采集未成年人测评数据却无同意校验，合规缺口"
      - "内存 repository，无持久化；进程重启数据全失"
      - "非四层结构（api.py + service.py 两模块），落 Postgres 时须重构 —— T-05"
      - "AssessmentSession/AssessmentTool/AssessmentResponse 实体尚未建模"

  - capability: assessment_result_projection
    business_capability: family_growth_assessment
    domain: domains/assessment
    purpose: >
      从已提交的 family-scoped AssessmentSession 与 Evidence 派生可回读的支持方向、
      解释和建议草案；不计算、不存储、不暴露家庭总分或排名。
    actor: [guardian]
    command: null
    api: "GET /families/{family_id}/assessments/results/latest"
    code:
      api: backend/domains/assessment/api/routes.py
      application: backend/domains/assessment/application/queries.py
    tests:
      - tests/domains/assessment/test_assessment_flow.py
      - tests/apps/family_api/test_assessment_routes.py
