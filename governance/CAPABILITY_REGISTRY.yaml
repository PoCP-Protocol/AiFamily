# AiFamily Capability Registry
#
# 这份 registry 的目的是把文档与代码真正打通：一个 capability 一行，
# 从 domain / actor / command / api / code / events / 治理要求 / status
# 一路可追溯到测试。它回答的问题是：
#
#   「这个能力属于哪个域、谁能调用、走哪个 Named Action、代码在哪、
#     需不需要 consent/audit/idempotency、有没有 AI 参与、现在能用吗」
#
# 与其它 registry 的分工：
#   DOMAIN_REGISTRY.yaml     — 域的唯一实现位置（R2：一个域一个位置）
#   MIGRATION_MANIFEST.yaml  — 每项资产的迁移处置（R3：无登记不得入仓）
#   CAPABILITY_REGISTRY.yaml — 本文件：能力级的端到端映射
#
# Traceability 目标链（见 docs/12_governance/DOCUMENT_GOVERNANCE.md）：
#   Strategy → Business Capability → Product Capability → Domain
#            → Command/Event → API → Code → Test → Metric
#
# ⚠️ 当前状态诚实声明：本 registry 只登记**真实存在且有代码证据的** capability。
# 当前尚无 capability 达到 PRODUCTION；已落地但尚未接入业务 API 的 P0 域能力，
# 也必须登记其边界与缺口。业务能力（CompleteGrowthAction 等）在对应 Batch
# 落地时逐条追加，
# 不预先登记未实现的能力 —— 预登记会让本文件变成愿望清单，
# 而 registry 的全部价值在于它描述事实。

schema_version: "1.0"
updated: "2026-08-30"

# ---------------------------------------------------------------------------
# 合法取值（供架构测试校验）
# ---------------------------------------------------------------------------
enums:
  status:
    - PLANNED                    # 已设计未编码
    - IMPLEMENTED_UNTESTED       # 有代码无测试（R4：不得声称可用）
    - IMPLEMENTED_TESTED         # 有代码有测试，但未接入生产流量
    - PRODUCTION                 # 真实承载生产流量（当前无任何能力达到）
  actor_type:
    - guardian                   # 家长/监护人
    - child                      # 未成年成员
    - operator                   # 平台运营
    - teacher                    # 教师/专家
    - system                     # 系统内部调度
    - ai                         # AI Agent（永不可写 canonical 状态，见 R9）

  # 上游归属：每个 capability 必须回答"我服务哪个业务能力"。
  # 取值来源 docs/02_business/BUSINESS_CAPABILITY_MAP.md 与
  # BUSINESS_ARCHITECTURE.md §1.3/§3；不是自由文本，新增取值须同时改这里、
  # 业务文档、以及 tools/architecture/check_traceability.py 的报告基线。
  #
  # 为什么是显式字段而不是从 domain 推导：domain 只复述代码位置
  # （domains/membership → membership），推导出的"归属"是同义反复，
  # 永远不会断链，也就永远证明不了任何事。上游链的价值恰在于**有人写下了
  # 这段代码为什么存在**。见 DOCUMENT_GOVERNANCE.md §6「向上」用法。
  business_capability:
    - PLATFORM_INTERNAL          # 平台内核原语，不直接服务某项业务能力；
                                 # 上溯终点是 REPOSITORY_CONSTITUTION 与
                                 # docs/06_platform/，不是业务能力地图
    - family_growth_assessment   # 入口层：家庭/父母成长测评（BUSINESS_ARCHITECTURE §3.2 入口层）
    - growth_plan_delivery       # 核心层：90天家庭成长计划的交付闭环（§3.2 核心层）
    - membership_and_benefits    # 生态层：会员与权益（§3.2 生态层，白皮书 Slide 8 订阅层）
    - product_intelligence       # 运营侧：市场信号→洞察→假设→验证（非家庭侧业务能力）
    - service_delivery           # 服务层：咨询、沙龙、城市活动等由真人交付的服务
                                 # （BUSINESS_ARCHITECTURE §商业层级表「服务层」一行）。
                                 # 与 membership_and_benefits 分开：会员是关系深度，
                                 # 服务是一次具体交付，两者不得互相换算
    - platform_runtime           # 运行时可用性（健康/就绪探针等运维面）

# ---------------------------------------------------------------------------
# 平台内核能力（Wave 1，非业务域）
# ---------------------------------------------------------------------------
capabilities:

  - capability: resolve_actor_context
    business_capability: PLATFORM_INTERNAL
    domain: platform/identity
    purpose: 构造不可变的 ActorContext / TenantContext，回答"谁在什么租户下以什么身份操作"
    actor: [system]
    command: null                # 平台原语，非业务 Named Action
    api: null
    code:
      domain: backend/platform/identity/context.py
    tests:
      - tests/platform/identity/
    consent: {required: false}
    audit: {required: false, note: "本身不改状态；它是审计记录的输入"}
    idempotency: {required: false}
    ai:
      involved: false
      note: >
        ActorContext 必须能诚实回答 is_ai()。这是 R9 的执行前提 ——
        上层据此拒绝 AI actor 写 canonical 状态。
    status: IMPLEMENTED_TESTED

  - capability: resolve_locale_context
    business_capability: PLATFORM_INTERNAL
    domain: platform/localization
    purpose: >
      在 TypeScript 客户端与 Python API/AI Runtime 之间传递并校验四维语言上下文：
      user_locale、content_locale、model_locale、policy_locale，以及显式 fallback 顺序
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/localization/context.py
      contract: contracts/schemas/locale-context.schema.json
      adapter: backend/platform/localization/fastapi.py
      catalog: backend/platform/localization/catalog.py
      artifact_contract: contracts/schemas/localized-artifact.schema.json
      coverage_eval: backend/platform/localization/catalog.py
    tests:
      - tests/platform/localization/test_context.py
      - tests/platform/localization/test_fastapi.py
      - tests/platform/localization/test_catalog.py
    consent: {required: false}
    audit: {required: false, note: "只解析不可变上下文，不改业务状态"}
    idempotency: {required: false}
    ai:
      involved: false
      note: >
        这是 AI/API 的共享边界原语，不执行翻译。没有可靠 locale 时显式失败，
        禁止把默认语言或静默机翻当作政策、风险或敏感建议的可靠支持。
    status: IMPLEMENTED_TESTED
    reference_implementation:
      - "50_开发_dev/reports/REPO_AUDIT_REPORT.md §3 C-1 / §4 A3"
      - "50_开发_dev/architecture/FAMILY_AI_PLATFORM_TECH_ARCHITECTURE_V4_1.md §18-19"
    known_gaps:
      - "catalog 与 coverage gate 仅为内存实现，尚未接入持久化、审核工作流、API Gateway 或语义/文化 locale Eval"

  - capability: authorize_action
    business_capability: PLATFORM_INTERNAL
    domain: platform/authorization
    purpose: 给定 (actor, action, resource) 返回 ALLOW/DENY，未注册组合 fail-closed
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/authorization/policy.py
    tests:
      - tests/platform/authorization/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false}
    ai:
      involved: false
      note: "human_only=True 的 action 对 AI actor 无条件拒绝"
    status: IMPLEMENTED_TESTED
    reference_implementation: "50_开发_dev/apps/api/src/modules/auth/family-authorization.policy.ts"

  - capability: check_consent
    business_capability: PLATFORM_INTERNAL
    domain: platform/consent
    purpose: 按 purpose 校验 consent 是否有效；撤回立即生效，无缓存
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/consent/models.py
      application: backend/platform/consent/gate.py
    tests:
      - tests/platform/consent/
    consent: {required: false, note: "它就是 consent 机制本身"}
    audit: {required: false}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    compliance_refs:
      - "docs/12_governance/COMPLIANCE_HARD_CONSTRAINTS.md §5 (禁止一次性打包勾选)"
    known_gaps:
      - "尚未支持《儿童个人信息网络保护规定》第10条要求的『同意界面同时提供拒绝选项』"
      - "尚未支持目的变更触发重新同意（第14条）"

  - capability: record_audit_event
    business_capability: PLATFORM_INTERNAL
    domain: platform/audit
    purpose: 记录 actor/tenant/action/resource/before/after/reason/correlation_id/timestamp
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/audit/models.py
      application: backend/platform/audit/recorder.py
    tests:
      - tests/platform/audit/
    consent: {required: false}
    audit: {required: false, note: "它就是审计机制本身"}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    known_gaps:
      - >
        当前只覆盖状态变更（R6）。《未成年人网络保护条例》第36条要求
        **读取访问**也须留痕，尚未实现 —— 见 COMPLIANCE_HARD_CONSTRAINTS.md §8。
      - "flush 到 DB 的接口存在但真实 audit 表尚未建（Batch 3 Family Core 时落地）"

  - capability: reserve_idempotency_key
    business_capability: PLATFORM_INTERNAL
    domain: platform/idempotency
    purpose: 同一 idempotency key 的重复请求被拒绝，保证命令只生效一次
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/platform/idempotency/keys.py
    tests:
      - tests/platform/idempotency/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false, note: "它就是幂等机制本身"}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED
    known_gaps:
      - "仅有 InMemoryIdempotencyStore；持久化实现待 Batch 3"

  - capability: unit_of_work_transaction
    business_capability: PLATFORM_INTERNAL
    domain: platform/persistence
    purpose: 同一 UoW 内的多个 repository 操作要么全提交要么全回滚
    actor: [system]
    command: null
    api: null
    code:
      infrastructure: backend/platform/persistence/unit_of_work.py
      session: backend/platform/persistence/session.py
    tests:
      - tests/platform/persistence/
    consent: {required: false}
    audit: {required: false}
    idempotency: {required: false}
    ai: {involved: false}
    status: IMPLEMENTED_TESTED

  - capability: service_fgcn_p0_collaboration
    business_capability: service_delivery
    domain: domains/service/fgcn
    purpose: >
      以已发布蓝图和家庭授权范围组织 ServiceCase、ServiceTask、人工确认分派、
      交付凭证、质量验收、ServiceContribution 与 100 单位影子分配依据
    actor: [guardian, teacher, operator, system]
    command: CONFIRM_SERVICE_TASK_ASSIGNMENT
    api:
      - "POST /families/{family_id}/fgcn/tasks/{service_task_id}/assignment-proposals"
      - "GET /families/{family_id}/fgcn/human-tasks/{task_id}"
      - "POST /families/{family_id}/fgcn/human-tasks/{task_id}/decisions"
      - "POST /families/{family_id}/fgcn/human-tasks/{task_id}/consume"
    code:
      domain: backend/domains/service/fgcn/engine.py
      application: backend/domains/service/fgcn/application.py
      persistence: backend/domains/service/fgcn/persistence.py
      migration: database/migrations/versions/0004_fgcn_p0_persistence.py
      idempotency_migration: database/migrations/versions/0005_fgcn_assignment_request_idempotency.py
      human_gate_persistence: backend/intelligence/human_gate/persistence.py
      human_gate_migration: database/migrations/versions/0006_ai_human_tasks.py
      worker_handler: backend/domains/service/fgcn/workflow_worker.py
      api: backend/domains/service/fgcn/api/routes.py
      # 支撑本能力同一条派单链的边界契约/localization/wiring 胶水，不是
      # 独立能力——entry.py 是 case-entry 依赖查询（CaseEntryDependencyQuery/
      # AsyncCaseEntryDependencyQuery，authorize_real_teacher_assignment(_durable)
      # 的 case_entry_dependencies 参数类型来源）；admission.py 是同一条链的
      # provider-admission 契约（ProviderAdmissionQuery/AsyncProviderAdmissionQuery，
      # 见 SqlAlchemyProviderAdmissionQuery 的真实实现）；scenario.py 是版本化、
      # locale-aware 的 S-01 场景事实；accepted_action.py 是 Human Gate accepted
      # action 到本域命令的组合根胶水。
      entry: backend/domains/service/fgcn/entry.py
      admission: backend/domains/service/fgcn/admission.py
      scenario: backend/domains/service/fgcn/scenario.py
      accepted_action_wiring: backend/domains/service/fgcn/accepted_action.py
      api_dependencies: backend/domains/service/fgcn/api/dependencies.py
      api_requests: backend/domains/service/fgcn/api/requests.py
      durable_provider_admission: backend/domains/service/fgcn/infrastructure/sqlalchemy_provider_admission.py
    tests:
      - tests/domains/service/fgcn/
    consent:
      required: true
      note: "任务分派重新校验 tenant/family/subject/purpose/consent_version scope"
    audit:
      required: true
      note: "权威事实变更与同事务持久化审计必须一起提交"
    idempotency:
      required: true
      note: "内存引擎和 durable allocation/assignment/contribution 写入均拒绝冲突重放"
    ai:
      involved: true
      note: "AI 只生成 service matching draft；分派、验收、贡献与分配必须由真人/业务域确认"
    status: IMPLEMENTED_TESTED
    compliance_refs:
      - governance/REPOSITORY_CONSTITUTION.md#r8
      - governance/REPOSITORY_CONSTITUTION.md#r9
      - docs/12_governance/COMPLIANCE_HARD_CONSTRAINTS.md#8-内部访问控制与年度审计是法定强制工程义务
    known_gaps:
      - "one-shot durable worker handler 已有；尚未挂载 FastAPI、常驻队列/lease 或重启重建完整 engine"
      - "真实 PostgreSQL round-trip 已有环境门禁测试；当前未配置 AIFAMILY_TEST_DATABASE_URL，因此本轮为 skip"
      - "返工、争议、资源准入、质量池释放和真实资金通道未实现"
      - "（已接线，2026-09-04）need_fulfillment_flow.fulfil_confirmed_draft 的真实
         教师分派授权曾只走 FGCNEngine 内存实例；现已可选切换到
         authorize_real_teacher_assignment_durable（真实落库），见
         governance/DOMAIN_REGISTRY.yaml 的 family_need_orchestration 条目"

  - capability: service_fgcn_quality_contribution
    business_capability: service_delivery
    domain: domains/service/fgcn
    purpose: >
      交付之后的质量审核与贡献事实记录——与交付本身分离的独立人工动作，
      只有通过审核才能产生 ServiceContribution；不调用 AI、不计算家庭价值、
      不产生资金/结算行（见该模块 docstring）。五公司对标研究（docs/13_research/
      market/FIVE_COMPANY_BENCHMARK_STATUS_V1.md §5）里指出这正是规避
      TikTok"纯流量决定曝光"反例、对标 Maven Clinic 可复现证据链的既有机制。
    actor: [operator, teacher]
    command:
      - verify_service_delivery
      - record_service_contribution
    api: null                    # 纯应用层命令，尚未挂载到任何 FastAPI router
    code:
      application: backend/domains/service/fgcn/quality_contribution_application.py
      contracts: backend/domains/service/fgcn/contracts.py
      idempotency: backend/domains/service/fgcn/idempotency.py
    tests:
      - tests/domains/service/fgcn/test_quality_contribution_application.py
    consent: {required: false, note: "运营/教师侧人工审核动作，不直接读写家庭个人数据字段"}
    audit: {required: true, note: "质量审核与贡献事实是权威状态变更，走 AuditRecorder"}
    idempotency: {required: true, note: "claim_mutation + effective_mutation_key 拒绝冲突重放"}
    ai:
      involved: false
      constraint: "该模块 docstring 明确声明：不调用 AI，质量审核必须是与交付分离的独立人工动作"
    status: IMPLEMENTED_TESTED
    known_gaps:
      - "尚未挂载 HTTP router——只能通过应用层直接调用或未来 FastAPI 路由触达"
      - "与 service_fgcn_p0_collaboration 共享 domains/service/fgcn 目录但分开登记，因为审核/贡献是与派单分离的独立人工动作，合并会掩盖这个边界"

  - capability: service_fgcn_blueprint_proposal_acceptance
    business_capability: service_delivery
    domain: domains/service/fgcn
    purpose: >
      Human Gate accepted action PROPOSE_SERVICE_BLUEPRINT 的业务域落点——记录
      人工确认接受了一条有证据绑定的 AI 推荐蓝图；不开 case、不派单、不预约、
      不通知、不产生外部 effect（见该模块 docstring）。
    actor: [guardian, operator]
    command:
      - accept_service_blueprint_proposal
    api: null                    # 通过 accepted_action_wiring.py 组合根接收 Human Gate 的 accepted action，非独立HTTP端点
    code:
      domain: backend/domains/service/fgcn/blueprint_proposal.py
      wiring: backend/apps/family_api/accepted_action_wiring.py
    tests:
      - tests/domains/service/fgcn/test_blueprint_proposal.py
    consent: {required: false, note: "记录人工对AI推荐的接受事实，不直接读写家庭个人数据字段"}
    audit: {required: true, note: "AuditRecorder 记录该 Human Gate accepted action 的落地"}
    idempotency: {required: true}
    ai:
      involved: true
      constraint: "AI 只生成待接受的蓝图推荐（PROPOSE_SERVICE_BLUEPRINT）；本能力只记录人工 ACCEPT 后的事实，AI 从不代替人工确认"
    status: IMPLEMENTED_TESTED
    known_gaps:
      - "尚未有独立 FastAPI 路由；只能通过 accepted_action_wiring 的组合根接收"

  - capability: service_fgcn_delivery_evidence
    business_capability: service_delivery
    domain: domains/service/fgcn
    purpose: >
      Human Gate 分派通过之后的第一条业务事实——把一个已接受的任务推进到
      "交付证据"状态；不调用 AI，不写贡献/结算记录（那是
      service_fgcn_quality_contribution 的职责，是下一步而非同一步）。
    actor: [teacher, operator]
    command:
      - submit_service_delivery
    api: null                    # 纯应用层命令，尚未挂载到任何 FastAPI router
    code:
      application: backend/domains/service/fgcn/delivery_application.py
      contracts: backend/domains/service/fgcn/contracts.py
    tests:
      - tests/domains/service/fgcn/test_delivery_application.py
    consent: {required: false, note: "运营/教师侧交付记录动作，不直接读写家庭个人数据字段"}
    audit: {required: true}
    idempotency: {required: true, note: "_replay_matches 拒绝冲突重放"}
    ai:
      involved: false
      constraint: "该模块 docstring 明确声明：不调用 AI，不写贡献/结算记录"
    status: IMPLEMENTED_TESTED
    known_gaps:
      - "尚未挂载 HTTP router——只能通过应用层直接调用"
      - "与 service_fgcn_quality_contribution 是同一条链的前后两步（先交付证据、再质量审核+贡献），分开登记是因为二者是两个独立人工动作，合并会掩盖这个边界"

  - capability: service_fgcn_progress_projection
    business_capability: service_delivery
    domain: domains/service/fgcn
    purpose: >
      只读的 FGCN 进度投影——把 ServiceCase/ServiceTask/交付/质量审核/贡献这些
      不可变事实投影成家庭可查看的进度视图（PDCA阶段、分配单位聚合等）；不
      加载数据、不修改聚合、不调用模型、不计算家庭分数/排名、不把影子分配
      单位换算成钱（见该模块 docstring）。
    actor: [guardian, teacher, operator]
    command: null                 # 只读投影，无写命令
    api: null                    # 尚未挂载到任何 FastAPI router
    code:
      domain: backend/domains/service/fgcn/read_model.py
    tests:
      - tests/domains/service/fgcn/test_read_model.py
    consent: {required: true, note: "家庭视角查看需校验 viewer scope（tenant/family/subject/purpose/consent）fail-closed"}
    audit: {required: false, note: "只读投影，不产生状态变更，无需审计"}
    idempotency: {required: false}
    ai:
      involved: false
      constraint: "该模块 docstring 明确声明：不调用模型，不计算家庭分数/排名（R9）"
    status: IMPLEMENTED_TESTED
    known_gaps:
      - "尚未挂载 HTTP router——家长端目前无法通过 API 查看这份进度投影"

# ---------------------------------------------------------------------------
# AI Runtime 能力（backend/intelligence，R10：各一份）
# ---------------------------------------------------------------------------
# 这两条是 AI 能力的前置基础设施，本身不服务某一项业务能力——它们约束的是
# **所有**业务能力将来怎么调模型。故 business_capability = PLATFORM_INTERNAL，
# 上溯终点是宪章 R7/R9/R10 与 COMPLIANCE_HARD_CONSTRAINTS.md，不是业务能力地图。

  - capability: admit_model_provider
    business_capability: PLATFORM_INTERNAL
    domain: intelligence/model_gateway
    purpose: >
      给定 (provider_id, data_class, environment) 返回准入的 ProviderRecord 或
      POLICY_REJECTED。未登记 / 状态未获批 / 环境不符 / 数据类别越权 / 第16条手续缺失
      一律 fail-closed，无宽松分支。
    actor: [system]
    command: null                # 平台原语，非业务 Named Action
    api: null
    code:
      domain: backend/intelligence/model_gateway/provider_registry.py
    tests:
      - tests/intelligence/model_gateway/test_provider_admission.py
    consent:
      required: false
      note: >
        准入检查的是"这个供应商能不能处理这一类数据"，不替代 consent。
        涉家庭/未成年人数据的调用方仍须自行过 platform/consent（第14条目的变更须重新同意）。
    audit:
      required: true
      note: "被拒绝的准入不产生 attempt 记录（没有外呼就不谎报外呼）；通过后由 attempt 账本留痕"
    idempotency: {required: false}
    ai:
      involved: false
      note: "它是约束 AI 外呼的机制本身，不含 AI 推断"
    status: IMPLEMENTED_TESTED
    compliance_refs:
      - >
        COMPLIANCE_HARD_CONSTRAINTS.md §7：《儿童个人信息网络保护规定》第16条
        委托第三方处理须先安全评估 + 签委托协议 + 不得超出授权范围 + **不得转委托** +
        解约时删除。五项各对应一个 ProviderRecord 字段并在 admit() 执行。
      - "§11.1：不得转委托需法务与商务介入，非纯技术决定"
    known_gaps:
      - >
        **零个外部供应商通过准入**。sub_delegates 为三态（true/false/未确立），
        未确立按禁止处理——因此 openai-compatible-unassessed 对任何数据类别都被拒。
        这是当前真实的治理状态，不是待填的占位。
      - >
        不做转委托的**技术**核验（无法从代码判断厂商是否再分包），只强制"必须有人
        填过这个字段且答案是 false"。答案的真实性依赖法务的评估结论。

  - capability: generate_model_draft
    business_capability: PLATFORM_INTERNAL
    domain: intelligence/model_gateway
    purpose: >
      经准入后对单个 provider 发起一次结构化生成：外呼前登记 attempt → 双层 timeout →
      JSON 解析 + schema 校验 → 强制完整 AiProvenance → 返回 ModelDraft。
      任何失败一律抛 ModelGatewayError，绝不返回原始模型文本，绝不降级。
    actor: [system]
    command: null
    api: null
    code:
      domain: backend/intelligence/model_gateway/contracts.py
      application: backend/intelligence/model_gateway/gateway.py
      infrastructure: backend/intelligence/model_gateway/providers/
    tests:
      - tests/intelligence/model_gateway/test_fail_closed.py
      - tests/intelligence/model_gateway/test_provenance_and_draft.py
      - tests/intelligence/model_gateway/test_openai_compatible_provider.py
      - tests/intelligence/model_gateway/test_routing_and_attempts.py
      - tests/architecture/test_ai_runtime_isolation.py
    consent:
      required: false
      note: "网关本身不判定 consent；调用方在构造 StructuredRequest 前须自行过闸"
    audit:
      required: true
      note: >
        每次外呼在**调用前**写入 attempt（STARTED），成功/失败/超时回写。
        顺序是刻意的：写在调用后的话，超时与进程崩溃就不留痕，审计轨迹里只剩成功。
    idempotency:
      required: false
      note: >
        automatic_retry = 0，因此不需要幂等键去重。retry=0 沿用源仓库决定并追加本仓库
        自己的理由：重试会把"经过几个受托处理者"变成网络天气的函数（第16条按处理者逐个
        计算义务），且反复重试直到模型吐出合法 JSON 是在优化"produce an answer"，
        与 R9 直接冲突。
    ai:
      involved: true
      constraint: >
        输出恒为 ModelDraft（status=DRAFT），may_mutate_business_state 是只读 property
        恒 False——不是带 False 默认值的字段，因此 dataclasses.replace 也改不到。
        backend/intelligence/ 下不得 import 业务域 repository 或 platform/persistence，
        由 tests/architecture/test_ai_runtime_isolation.py 机械强制（已验证会咬人）。
        canonical 写入只能经业务域自己的 Named Action + 人工闸门（R8/R9）。
    status: IMPLEMENTED_TESTED
    reference_implementation: "50_开发_dev/packages/ai-gateway/src/index.ts（894行，作为设计参考重译为 Python，未搬 TS 代码结构）"
    compliance_refs:
      - >
        COMPLIANCE_HARD_CONSTRAINTS.md §2：PIPL 第24条要求自动化决策可解释，
        故 provenance 记录 model / model_version / prompt_version /
        context_snapshot_ref / confidence / latency_ms / provider_id 为**强制**。
        AiProvenance 的身份字段缺一即构造失败。
      - "R9 / AI_NATIVE_PRINCIPLES.md §2：AI 原生不放宽约束，AI 是主干所以约束更严"
    known_gaps:
      - "Attempt 账本仅进程内（InMemoryAttemptSink），无持久化表。持久化归 T-07 的读取留痕扩展。"
      - "schema 校验是 JSON Schema 子集（type/required/properties/items/enum）；引入 jsonschema 属 R11 决策需 ADR。"
      - "confidence 依赖 provider 上报，多数 OpenAI 兼容厂商不报，故记为 None——刻意不编造数值填进合规记录。"
      - "Prompt/Schema Registry 已提供独立解析器；ModelGateway 仍要求调用方在构造请求前完成版本解析，尚未在 Gateway 内强制校验 prompt_version/schema_version 指向已发布资产。"
      - "无调用方：无业务域使用、无 HTTP 路由。按 R4 是'能力存在且有测试'，不是'已投入使用'。"

