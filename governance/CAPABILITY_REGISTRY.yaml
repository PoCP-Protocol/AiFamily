  - path: backend/domains/market_intelligence
    reason: "52行，仅 domain/entities.py + errors.py，无应用层无持久化"
  - path: backend/domains/product_strategy
    reason: "159行，仅 domain + ports + fake repository，无真实持久化"
  - path: backend/domains/growth_plan
    reason: "37行，仅错误类型枚举，无实体模型"
  - path: backend/intelligence/design_copilot
    reason: "compiler.py / simulation.py 全是 NotImplementedError，零调用方"
  - path: backend/packages/contracts
    reason: "共享契约类型（Provenance/evidence），是被依赖的原语而非独立能力"

# ---------------------------------------------------------------------------
# 执行状态（R14：写成文档不算执行）
# ---------------------------------------------------------------------------
enforcement:
  implemented:
    - "tests/architecture/test_capability_registry.py 校验 schema 与枚举合法性（待建）"
  missing:
    - >
      code 字段指向的路径是否真实存在 —— 目前无检查器，registry 可以指向死路径而 CI 不报错。
      这正是源仓库 FPAI_PROVIDER_REGISTRY 漂移的同类风险。
    - "api 字段与实际 FastAPI 路由的一致性检查"
    - "tests 字段指向的测试是否真实存在且通过"
    - >
      Traceability 断链检查器（tools/architecture/ 目录当前为空）——
      Strategy→Capability→Code→Test 的链路完整性尚无自动验证。
