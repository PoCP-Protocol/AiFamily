# ---------------------------------------------------------------------------
# 执行状态（R14：写成文档不算执行）
# ---------------------------------------------------------------------------
enforcement:
  implemented:
    - "tests/architecture/test_capability_registry.py 校验 schema 与枚举合法性"
    - "同上：code / tests 字段指向的路径必须真实存在（test_declared_code_paths_exist）"
    - "同上：business_capability 必须存在且取值合法（test_every_capability_has_upstream_attribution）"
    - >
      tools/architecture/check_traceability.py（T-08）报告三类断链：
      UPSTREAM（无业务能力归属）/ CODE_GAP（backend 下有 .py 但无 capability 覆盖）/
      API_ORPHAN（代码有路由 registry 无登记，或 registry 声称 api 代码里没有）。
      **当前为报告模式，退出码恒为 0，不失败 CI** —— 促转强制的顺序见该脚本 docstring。
  missing:
    - "tests 字段指向的测试是否真实存在且**通过**（存在性已查，通过性未查）"
    - >
      API_ORPHAN 尚未转为强制门。当前快照有 37 条 CERTAIN，其中 11 条来自本文件
      membership_tier_lifecycle 的 `api: null` 与已存在的
      backend/domains/membership/api/routes.py 冲突 —— 见该条目 known_gaps。
    - >
      Product Capability 层（docs/03_product/）与 Metric 层（docs/09_operations/）
      仍未进入 registry，追溯链两端仍不可机械验证。
