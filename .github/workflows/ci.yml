name: CI

on:
  push:
  pull_request:

jobs:
  architecture:
    name: Lint + Architecture Tests
    runs-on: ubuntu-latest
    # Real PostgreSQL for the Postgres-gated tests under tests/database/ (and any
    # other test that opts in via AIFAMILY_TEST_DATABASE_URL). Without this
    # service every one of those tests either fails with a connection error
    # (no server listening on 127.0.0.1) or silently skips depending on how it
    # is gated — both hide real migration/schema regressions from CI. Image and
    # env vars are kept identical to docker-compose.dev.yml's `postgres` service
    # so a failure reproduces the same way locally and in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aifamily
          POSTGRES_PASSWORD: aifamily
          POSTGRES_DB: aifamily_test
        ports:
          - 55442:5432
        options: >-
          --health-cmd "pg_isready -U aifamily -d aifamily_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      AIFAMILY_TEST_DATABASE_URL: postgresql+asyncpg://aifamily:aifamily@localhost:55442/aifamily_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Apply Alembic migrations to CI Postgres (head)
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.AIFAMILY_TEST_DATABASE_URL }}

      - name: Lint (ruff)
        run: uv run ruff check .

      # 格式化门（ADR-0009）。**警告级，不失败** —— 这是 ADR 明写的过渡状态：
      # 全量 sweep 尚未完成（并发 agent 正在写 backend/platform、backend/apps、
      # backend/domains/{service,membership} 与 tests/platform，重排会覆盖他们
      # 未提交的工作），此时设成失败级会立刻制造一个新的长期红灯 —— 正是本次
      # 任务要消灭的东西。
      #
      # `|| true` 让这一步永不阻断，但差异会打进日志，于是"还差多少文件"这件事
      # 从不可见变成每次 run 都能看到。sweep 收尾的那次任务负责删掉 `|| true`。
      # 删除它之前请先确认 `ruff format --check .` 本地为零差异。
      - name: Format check (ruff format) — warning only until sweep completes
        run: |
          uv run ruff format --check . || {
            echo "::warning title=Unformatted files::ruff format --check 报告差异。ADR-0009 的全量 sweep 未完成，此步为警告级，不阻断 CI。"
            true
          }

      # 架构护栏单独先跑一步：它最快，且失败信息最有诊断价值——
      # 结构性违规应当在业务测试的噪声之前被看到。下一步会再次覆盖它们，
      # 这个重复是有意的（R14：护栏必须在 CI 中运行）。
      - name: Architecture tests (fail fast)
        run: uv run pytest tests/architecture -v

      # 无条件跑全量。pyproject.toml 的 testpaths = ["tests"] 覆盖
      # tests/{architecture,platform,domains,apps,intelligence,database}。
      #
      # 此前这里是一个 `find backend -name "test_*.py" | grep -q .` 条件块（Wave 0 遗留），
      # 它只跑 backend/ 下的测试，于是 tests/platform(464 行)、tests/domains、
      # tests/apps、tests/intelligence **从未在 CI 中运行过**——它唯一的实际作用
      # 是让人以为测试跑了。这正是 R14 伤疤的形状：源仓库全域只有一个真正生效的
      # workflow 且被 path filter 限定在三处，导致一个正在失败的不变量被提交进了主线。
      - name: Full test suite
        run: uv run pytest -v

      # product_intelligence 的测试住在 backend/domains/product_intelligence/tests/，
      # 不在 testpaths 覆盖范围内，所以必须显式跑。
      # 若将来它们迁到 tests/ 下，删掉这一步。
      - name: Domain-local tests outside testpaths (product_intelligence)
        run: uv run pytest backend/domains/product_intelligence/tests -v
