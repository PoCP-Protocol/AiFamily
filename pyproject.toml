[project]
name = "aifamily"
version = "0.0.0"
description = "AiFamily — AI-native Family Growth Operating System (canonical repository)"
requires-python = ">=3.12"

# Wave 1 (AIFAMILY-001) introduces the first real runtime dependencies:
# FastAPI (fastapi_runtime_entrypoint), SQLAlchemy + Alembic (platform/persistence),
# and Pydantic v2 for the identity/consent/audit value objects. asyncpg is the
# production Postgres driver; aiosqlite backs the in-memory test database so
# tests never require a running Postgres instance (see
# backend/domains/product_intelligence tests/conftest.py pattern in the source
# repository for the precedent this follows).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
minversion = "8.0"
# rootdir-relative import mode so `backend` and `tools` resolve without
# PYTHONPATH tricks. The legacy repository's Python code required an implicit
# cwd of `50_开发_dev/backend` to resolve `packages.contracts` imports; that
# class of hidden coupling is banned here by construction.
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# frontend/ is the migrated TypeScript (Expo) app. The handful of .py files in
# there are one-off asset-cropping / research utilities that were migrated
# byte-identical to the source repository on purpose — keeping the migration
# diff verifiable matters more than lint conformance on throwaway scripts.
# Backend Python is fully linted; nothing here relaxes that.
exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults. FastAPI's dependency
# injection *requires* `= Depends(...)` in the signature — it is the framework's
# documented API, not a mutable-default bug. Exempting only these two callables
# keeps B008 live for every other case.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
