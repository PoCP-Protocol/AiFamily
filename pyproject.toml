[project]
name = "aifamily"
version = "0.0.0"
description = "AiFamily — AI-native Family Growth Operating System (canonical repository)"
requires-python = ">=3.12"

# Wave 1 (AIFAMILY-001) introduces the first real runtime dependencies:
# FastAPI (fastapi_runtime_entrypoint), SQLAlchemy + Alembic (platform/persistence),
# and Pydantic v2 for the identity/consent/audit value objects. asyncpg is the
# production Postgres driver; aiosqlite backs the in-memory test database so
# tests never require a running Postgres instance (see
# backend/domains/product_intelligence tests/conftest.py pattern in the source
# repository for the precedent this follows).
#
# T-06 (Model Gateway) promotes two packages from dev to runtime dependencies.
# Both were already present under [dev]; the move is required because production
# code now imports them, and a runtime import satisfied only by a dev extra is a
# deployment that works on a developer machine and fails in production:
#
#   httpx   — backend/intelligence/model_gateway/providers/openai_compatible.py
#             is the real provider adapter. It was dev-only because httpx had
#             only ever been used by fastapi.testclient.
#   pyyaml  — model_gateway/provider_registry.py::load_provider_registry parses a
#             YAML provider-governance declaration. Kept as a deferred import
#             inside that one function, so a runtime that declares its providers
#             in code never pays for it — but it is a real runtime dependency of
#             a supported code path, so it is declared as one.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
minversion = "8.0"
# rootdir-relative import mode so `backend` and `tools` resolve without
# PYTHONPATH tricks. The legacy repository's Python code required an implicit
# cwd of `50_开发_dev/backend` to resolve `packages.contracts` imports; that
# class of hidden coupling is banned here by construction.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# frontend/ is the migrated TypeScript (Expo) app. The handful of .py files in
# there are one-off asset-cropping / research utilities that were migrated
# byte-identical to the source repository on purpose — keeping the migration
# diff verifiable matters more than lint conformance on throwaway scripts.
# Backend Python is fully linted; nothing here relaxes that.
# pytest's negative-control fixtures are intentionally invalid Python and must
# not become repository production-code lint debt when a run uses an in-repo
# temporary root.
exclude = ["frontend"]
extend-exclude = [".codex-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults. FastAPI's dependency
# injection *requires* `= Depends(...)` in the signature — it is the framework's
# documented API, not a mutable-default bug. Exempting only these two callables
# keeps B008 live for every other case.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
