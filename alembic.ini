# Alembic configuration for AiFamily.
#
# `script_location` is `database/migrations` rather than the Alembic default
# `alembic/` because governance/MIGRATION_MANIFEST.yaml's `database_schema`
# entry declares `target: [database/migrations]`. The manifest is the
# authority on where a migrated capability lands, and R3 traceability depends
# on the on-disk layout matching the manifest.
#
# No database URL is set here on purpose. `env.py` resolves it from
# backend.platform.persistence.session.resolve_database_url(), so the app and
# the migration tool can never disagree about which database they target, and
# no credential is committed to version control.

[alembic]
script_location = database/migrations
version_path_separator = os
# Deliberately no `prepend_sys_path`: R12 forbids resolving imports through
# process cwd / path injection. `backend` is a real installed package (uv
# installs this project editable from pyproject.toml's
# [tool.hatch.build.targets.wheel] packages = ["backend"]), so `env.py`'s
# `from backend.platform.persistence...` import resolves without any path
# manipulation. If that import ever fails, the fix is to install the project
# (`uv sync`), not to add a path hack.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
